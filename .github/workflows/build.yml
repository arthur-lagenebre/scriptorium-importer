name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Scriptorium.Mtg.Importer.slnx

      - name: Build
        run: dotnet build Scriptorium.Mtg.Importer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Scriptorium.Mtg.Importer.slnx --no-build --configuration Release --verbosity normal
